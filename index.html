<style>
:root{
  --paper:#FDF2EF;
  --paper-2:#FFF9F8;
  --card:#FFFDFC;
  --ink:#4C3B3E;
  --ink-soft:#8B7175;
  --ink-faint:#BBA3A6;
  --rose:#E88AA0;
  --rose-deep:#D96A85;
  --rose-soft:#F7C9D4;
  --rose-mist:#FBE5EA;
  --marker:rgba(244,170,192,.5);
  --c:#E88AA0;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  background:var(--paper);
  font-family:'Nunito',system-ui,sans-serif;
  font-size:15px;line-height:1.55;overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:var(--marker)}
.script{font-family:'Caveat',cursive}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:22px 18px calc(120px + var(--safe-b))}
header{text-align:center;margin-bottom:22px}
.bow{display:block;margin:0 auto 2px}
.brand{font-family:'Comfortaa',cursive;font-weight:600;font-size:23px;letter-spacing:.22em;
  text-transform:lowercase;color:var(--ink)}
.tagline{font-family:'Caveat',cursive;font-size:22px;color:var(--rose-deep);margin-top:-2px}

.install{display:none;margin:12px auto 0;padding:9px 18px;border-radius:999px;
  font-family:'Comfortaa',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.04em;
  color:#fff;background:linear-gradient(130deg,#F3A6B9,#E0798F);
  box-shadow:0 10px 20px -10px rgba(224,121,143,.85)}
.install:active{transform:scale(.96)}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:13px 16px 13px 42px;border-radius:999px;border:1.5px solid var(--rose-mist);
  background:var(--paper-2);outline:none;font-size:14.5px;box-shadow:0 6px 16px -12px rgba(214,120,140,.6)}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{border-color:var(--rose-soft);box-shadow:0 0 0 4px rgba(247,201,212,.35)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--rose)}

/* ---------- category rail ---------- */
.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 6px;padding:2px 18px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;
  border:1.5px solid var(--rose-mist);background:var(--paper-2);
  font-family:'Comfortaa',sans-serif;font-size:12.5px;font-weight:500;color:var(--ink-soft);
  letter-spacing:.03em;transition:.2s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{color:#fff;background:var(--rose);border-color:var(--rose)}
.chip.on .dot{background:#fff}
.chip.add{border-style:dashed;color:var(--rose-deep)}
.chip:active{transform:scale(.95)}

/* ---------- notes ---------- */
#grid{columns:2;column-gap:14px}
@media(max-width:620px){#grid{columns:1}}
@media(min-width:900px){#grid{columns:3}}
.card{break-inside:avoid;position:relative;overflow:hidden;margin-bottom:14px;padding:18px 18px 14px;
  border-radius:24px;background:var(--card);border:1.5px solid var(--rose-mist);
  box-shadow:0 14px 30px -20px rgba(190,120,140,.75);
  cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;
  animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);opacity:.55}
.card:hover{transform:translateY(-3px) rotate(-.6deg);border-color:var(--c);
  box-shadow:0 20px 34px -20px rgba(190,120,140,.9)}
.card:active{transform:scale(.99)}
.ghost{position:absolute;right:-10px;bottom:-18px;font-size:88px;line-height:1;opacity:.09;pointer-events:none}
.card .emo{font-size:26px;line-height:1;display:block;margin-bottom:8px}
.card h3{margin:0 0 6px;font-family:'Comfortaa',sans-serif;font-weight:600;font-size:15.5px;
  letter-spacing:.01em;word-break:break-word;display:inline;
  background:linear-gradient(var(--marker),var(--marker));background-size:100% 62%;
  background-position:0 88%;background-repeat:no-repeat;padding:0 3px;box-decoration-break:clone}
.card .txt{margin:8px 0 0;font-size:14px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mini{margin:10px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-soft)}
.mini li{display:flex;gap:8px;align-items:flex-start;padding:2.5px 0}
.mini .mk{color:var(--c);flex:0 0 auto;font-weight:700;min-width:15px}
.mini li.done>span:last-child{text-decoration:line-through;color:var(--ink-faint)}
.more{font-family:'Caveat',cursive;font-size:16px;color:var(--ink-faint);padding-left:23px}
.rule{display:flex;align-items:center;gap:9px;margin:12px 0 9px;color:var(--rose-soft);font-size:11px}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:var(--rose-mist)}
.card footer{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--ink-faint);font-family:'Comfortaa',sans-serif;letter-spacing:.04em}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--ink);font-weight:500;font-size:11px;
  border:1px solid color-mix(in srgb,var(--c) 32%,#fff)}

.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty .big{font-size:44px;display:block;margin-bottom:10px}
.empty b{display:block;font-family:'Comfortaa',sans-serif;font-size:16px;color:var(--ink);
  margin-bottom:4px;font-weight:600;letter-spacing:.04em}
.empty .script{font-size:21px;color:var(--rose-deep)}

/* ---------- fab ---------- */
.fab{position:fixed;right:20px;bottom:calc(22px + var(--safe-b));z-index:20;width:60px;height:60px;
  border-radius:50%;display:grid;place-items:center;font-size:27px;color:#fff;
  background:linear-gradient(150deg,#F3A6B9,#E0798F);
  box-shadow:0 14px 28px -10px rgba(224,121,143,.75),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fab:hover{transform:scale(1.07) rotate(90deg)}
.fab:active{transform:scale(.92)}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(96,60,68,.32);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease}
@media(min-width:700px){.veil{align-items:center}}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;
  background:var(--paper-2);border:1.5px solid var(--rose-mist);border-bottom:0;
  border-radius:28px 28px 0 0;box-shadow:0 -18px 50px rgba(150,90,105,.25);
  animation:up .32s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.sheet{border-radius:28px;border-bottom:1.5px solid var(--rose-mist)}}
@keyframes up{from{transform:translateY(28px);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sheet-h .t{font-family:'Caveat',cursive;font-size:24px;color:var(--rose-deep)}
.sheet-b{overflow-y:auto;padding:2px 18px 18px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:13px 18px calc(15px + var(--safe-b));border-top:1.5px solid var(--rose-mist)}
.x{width:32px;height:32px;border-radius:50%;background:var(--rose-mist);display:grid;place-items:center;
  font-size:15px;color:var(--rose-deep)}
.x:active{transform:scale(.9)}

.btn{flex:1;padding:14px;border-radius:999px;font-family:'Comfortaa',sans-serif;font-weight:600;
  font-size:14.5px;text-align:center;letter-spacing:.04em;transition:.2s}
.btn.primary{background:linear-gradient(130deg,#F3A6B9,#E0798F);color:#fff;
  box-shadow:0 12px 22px -12px rgba(224,121,143,.9)}
.btn.ghost{flex:0 0 auto;padding:14px 18px;background:#fff;color:var(--ink-soft);border:1.5px solid var(--rose-mist)}
.btn.danger{color:var(--rose-deep)}
.btn:active{transform:scale(.97)}

/* ---------- editor ---------- */
.emoji-btn{width:70px;height:70px;border-radius:24px;font-size:34px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 12%,#fff);border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);
  flex:0 0 auto;transition:.2s}
.emoji-btn:active{transform:scale(.94)}
.row{display:flex;gap:12px;align-items:center}
.f-title{flex:1;min-width:0;background:none;border:0;outline:none;padding:8px 0;
  font-family:'Comfortaa',sans-serif;font-weight:600;font-size:18px;
  border-bottom:2px solid var(--rose-mist)}
.f-title:focus{border-color:var(--rose-soft)}
.f-title::placeholder{color:var(--ink-faint);font-weight:400}
.label{display:flex;align-items:center;gap:7px;font-family:'Comfortaa',sans-serif;font-size:11.5px;
  letter-spacing:.16em;text-transform:lowercase;color:var(--ink-soft);margin:20px 0 9px;font-weight:600}
.label::after{content:'';flex:1;height:1px;background:var(--rose-mist)}
textarea.f-text{width:100%;min-height:120px;resize:vertical;padding:14px;border-radius:18px;
  border:1.5px solid var(--rose-mist);background:#fff;outline:none;font-size:15px;line-height:1.65;
  color:var(--ink)}
textarea.f-text:focus{border-color:var(--rose-soft);box-shadow:0 0 0 4px rgba(247,201,212,.3)}
textarea.f-text::placeholder{color:var(--ink-faint)}

.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--rose-mist);padding:5px;border-radius:16px}
.seg button{flex:1 0 30%;padding:9px 6px;border-radius:12px;font-family:'Comfortaa',sans-serif;
  font-size:12px;font-weight:500;color:var(--ink-soft);transition:.2s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--rose-deep);box-shadow:0 4px 10px -6px rgba(190,120,140,.8)}

.items{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--rose-mist);
  border-radius:15px;padding:3px 6px 3px 12px}
.item .mk{color:var(--c);font-weight:700;font-size:14px;min-width:17px;text-align:center;flex:0 0 auto}
.item .box{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rose-soft);flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;color:#fff;background:#fff}
.item .box.on{background:var(--c);border-color:var(--c)}
.item input{flex:1;min-width:0;background:none;border:0;outline:none;padding:9px 0;font-size:14.5px}
.item input::placeholder{color:var(--ink-faint)}
.item .rm{padding:8px;color:var(--ink-faint);font-size:14px}
.add-item{margin-top:9px;width:100%;text-align:left;font-family:'Comfortaa',sans-serif;font-size:12.5px;
  color:var(--rose-deep);font-weight:500;padding:11px 14px;border-radius:14px;
  border:1.5px dashed var(--rose-soft);background:#fff}

/* ---------- emoji picker ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:7px 11px;border-radius:13px;font-size:18px;background:#fff;
  border:1.5px solid transparent}
.tabs button.on{border-color:var(--rose-soft);background:var(--rose-mist)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.emoji-grid button{font-size:25px;padding:7px 0;border-radius:13px;transition:.15s}
.emoji-grid button:hover{background:var(--rose-mist);transform:scale(1.15)}

/* ---------- categories ---------- */
.cat-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;background:#fff;
  border:1.5px solid var(--rose-mist);margin-bottom:8px}
.cat-row .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:0 0 auto}
.cat-row span{flex:1;font-weight:600;font-size:14.5px}
.cat-row .n{font-family:'Caveat',cursive;font-size:17px;color:var(--ink-faint);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 4px}
.sw{width:31px;height:31px;border-radius:50%;border:2.5px solid transparent;transition:.2s;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.sw.on{border-color:var(--ink-soft);transform:scale(1.12)}
.new-cat{display:flex;gap:9px;margin-top:8px}
.new-cat input{flex:1;min-width:0;padding:12px 15px;border-radius:15px;border:1.5px solid var(--rose-mist);
  background:#fff;outline:none}
.new-cat input:focus{border-color:var(--rose-soft)}
.new-cat input::placeholder{color:var(--ink-faint)}
.new-cat button{padding:0 20px;border-radius:15px;background:linear-gradient(130deg,#F3A6B9,#E0798F);
  font-family:'Comfortaa',sans-serif;font-weight:600;font-size:13px;color:#fff}

#burst{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.hb{position:absolute;color:var(--rose);animation:float 1.5s cubic-bezier(.25,.6,.35,1) forwards}
@keyframes float{
  0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0deg)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),-160px) scale(1) rotate(var(--dr))}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>

<div id="sky"><div id="doodles"></div><div id="tint"></div></div>

<div id="app">
  <header>
    <svg class="bow" width="62" height="40" viewBox="0 0 62 40" fill="none">
      <path d="M31 34c-8-6-14-12-14-19 0-5 6-8 10-5 2 1.5 3.2 3 4 4.4.8-1.4 2-2.9 4-4.4 4-3 10 0 10 5 0 7-6 13-14 19Z" fill="#F7C9D4" stroke="#E88AA0" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 20c1.5 0 3-1.5 3-3 0 1.5 1.5 3 3 3-1.5 0-3 1.5-3 3 0-1.5-1.5-3-3-3Z" fill="#E88AA0" opacity=".8"/>
      <path d="M48 12c1.8 0 3.5-1.7 3.5-3.5 0 1.8 1.7 3.5 3.5 3.5-1.8 0-3.5 1.7-3.5 3.5 0-1.8-1.7-3.5-3.5-3.5Z" fill="#E88AA0" opacity=".8"/>
      <path d="M52 26c-1 1.4-1 2.6 0 4M8 30c1-1.4 1-2.6 0-4" stroke="#E88AA0" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    </svg>
    <div class="brand">клаптик</div>
    <div class="tagline">маленькі думки, великі списки</div>
    <button class="install" id="installBtn">＋ встановити застосунок</button>
  </header>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="знайти нотатку" autocomplete="off">
  </div>

  <div class="rail" id="rail"></div>
  <div id="grid"></div>
</div>

<button class="fab" id="fab" aria-label="Нова нотатка">+</button>
<div id="modals"></div>
<div id="burst"></div>

<script>
/* ============ data ============ */
const PALETTE=['#E88AA0','#F4A9B8','#EFB9A0','#E5C07A','#B8C79A','#9EC4C6','#B3A7D6','#D7A3C4'];
const KEY='klaptyk.v1';
const uid=()=>Math.random().toString(36).slice(2,9);

let S=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.notes)return d;}catch(e){}
  return{
    categories:[
      {id:uid(),name:'уроки',color:'#E88AA0'},
      {id:uid(),name:'ідеї',color:'#9EC4C6'},
      {id:uid(),name:'особисте',color:'#B3A7D6'}
    ],
    notes:[]
  };
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cat=id=>S.categories.find(c=>c.id===id);
const colorOf=n=>{const c=cat(n.catId);return c?c.color:'#D9BFC4'};

let filter='all', query='';

/* ============ emoji ============ */
const EMOJI={
'💗':'💗 🩰 💕 🫶 🌸 🌷 🫧 🕯️ 🧸 🪞 💌 💝 🍰 🧁 🍓 ☕ 🫖 🪄 ✨ 🤍 🩷 💐 🦢 🪶 🌙 ⭐ 🎧 📖 🛁 🧴 💅 👛 👜 🎂 🍒 🥂 🪷 🌺 💞 💫',
'😊':'😀 😃 😄 😁 😆 🥹 😂 🙂 🙃 😉 😊 😇 🥰 😍 🤩 😘 😋 😛 🤪 🤔 🤨 😐 🙄 😮 😴 😌 😔 😟 🙁 😣 😫 🥺 😢 😭 😤 😠 🤯 😳 🥵 🥶 😱 🤗 🤭 🫢 🤫 🥱 😬 🫠 🤓 🧐 😎 🥳 😏 🫡',
'✋':'👋 🤚 ✋ 👌 🤌 🤏 ✌️ 🤞 🫰 🤟 👈 👉 👆 👇 ☝️ 👍 👎 ✊ 👏 🙌 🫶 👐 🤲 🤝 🙏 💪 👀 🧠 👶 🧒 👧 🧑 👩 👨 🧓 🧚 🧙 🦸 💃 🕺 🧘 🚶 🏃 👫 💑',
'🌿':'🌱 🌿 ☘️ 🍀 🍃 🍂 🍁 🌾 🌵 🌴 🌳 🪴 🌷 🌹 🥀 🌺 🌸 🌼 🌻 🌞 🌝 🌜 ⭐ 🌟 ✨ ⚡ 🔥 ❄️ 🌈 ☁️ 🌤️ 🌧️ ⛈️ 🌊 💧 🐝 🦋 🐞 🐌 🐢 🐬 🐳 🦊 🐰 🐱 🐶 🦉 🕊️ 🦄 🐴',
'🍓':'🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥝 🍅 🥑 🥦 🥕 🌽 🍞 🥐 🧀 🥚 🍳 🥞 🧇 🍔 🍟 🍕 🥪 🌮 🥗 🍝 🍜 🍣 🍱 🍤 🍦 🍰 🧁 🥧 🍫 🍬 🍭 🍪 ☕ 🍵 🧃 🥤 🍷 🥂',
'⚽':'⚽ 🏀 🎾 🏐 🏓 🏸 🥊 🥋 ⛳ 🎿 🏂 🏄 🏊 🚴 🧗 🤸 🏆 🥇 🥈 🥉 🎯 🎳 🎮 🎲 ♟️ 🧩 🎨 🎭 🎬 🎤 🎧 🎼 🎹 🥁 🎸 🎻 🪄 🎪 🎡 🎢',
'✈️':'🚗 🚕 🚌 🏎️ 🚲 🛴 🛵 🚂 🚆 ✈️ 🛫 🚀 🚁 ⛵ 🚢 🗺️ 🧭 🏝️ 🏖️ 🏔️ ⛰️ 🏕️ 🏡 🏠 🏢 🏰 🗼 ⛲ 🌉 🌃 🌅 🧳 🎒 🛎️ 🏨',
'📚':'📚 📖 📕 📗 📘 📙 📔 📓 📒 📝 ✏️ ✒️ 🖊️ 🖍️ 🖌️ 📄 📑 🔖 🏷️ 📌 📍 📎 📐 📏 ✂️ 🗂️ 📁 📅 📆 🗓️ ⏰ ⏱️ ⌛ 🔔 🔑 🔒 💡 🔦 💻 ⌨️ 📱 📷 🎥 📺 🔍 🔬 💊 🧴 🧺 🧹 🛒 💰 💳',
'✨':'❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 🩷 💖 💗 💓 💞 💕 💘 💝 💔 ❣️ 💯 ✅ ☑️ ✔️ ❌ ⭕ ❗ ❓ 💬 💭 ⚠️ ♻️ 🆕 ⏳ 🎉 🎊 🎈 🎁 🏅 👑 💎 🔮 ☀️ ⚓ 🧿 🪞 🕯️ 🧸'
};
const TABS=Object.keys(EMOJI);

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STYLES=[['heart','♡ сердечка'],['bullet','• крапки'],['number','1. цифри'],['check','✓ галочки'],['none','без маркерів']];
function marker(style,i,done){
  if(style==='heart')return done?'♥':'♡';
  if(style==='bullet')return '•';
  if(style==='number')return i+1+'.';
  if(style==='check')return done?'✓':'○';
  return '';
}

function visible(){
  const q=query.trim().toLowerCase();
  return S.notes
    .filter(n=>filter==='all'||n.catId===filter)
    .filter(n=>!q||(n.title+' '+n.text+' '+(n.list?n.list.items.map(i=>i.text).join(' '):'')).toLowerCase().includes(q))
    .sort((a,b)=>b.updated-a.updated);
}

function renderRail(){
  const r=$('#rail');
  r.innerHTML=
    `<button class="chip ${filter==='all'?'on':''}" data-f="all">усі</button>`+
    S.categories.map(c=>`<button class="chip ${filter===c.id?'on':''}" data-f="${c.id}" style="--c:${c.color}"><i class="dot"></i>${esc(c.name)}</button>`).join('')+
    `<button class="chip add" id="mgCats">＋ категорія</button>`;
  r.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  $('#mgCats').onclick=()=>catSheet();
}

function renderGrid(){
  const list=visible();
  if(!list.length){
    $('#grid').innerHTML=`<div class="empty"><span class="big">💗</span>
      <b>${S.notes.length?'нічого не знайшлося':'тут поки порожньо'}</b>
      <span class="script">${S.notes.length?'спробуй інше слово ♡':'натисни плюс — і з’явиться перший клаптик ♡'}</span></div>`;
    return;
  }
  $('#grid').innerHTML=list.map((n,idx)=>{
    const c=colorOf(n), ct=cat(n.catId);
    const items=n.list?n.list.items.filter(i=>i.text.trim()):[];
    let mini='';
    if(items.length){
      mini='<ul class="mini">'+items.slice(0,4).map((it,i)=>
        `<li class="${it.done?'done':''}"><span class="mk">${marker(n.list.style,i,it.done)}</span><span>${esc(it.text)}</span></li>`).join('')+
        (items.length>4?`<li class="more">та ще ${items.length-4}…</li>`:'')+'</ul>';
    }
    return `<article class="card" style="--c:${c};animation-delay:${Math.min(idx*40,360)}ms" data-id="${n.id}">
      <span class="ghost">${n.emoji||'📝'}</span>
      <span class="emo">${n.emoji||'📝'}</span>
      ${n.title?`<h3>${esc(n.title)}</h3>`:''}
      ${n.text?`<div class="txt">${esc(n.text)}</div>`:''}
      ${mini}
      <div class="rule">♡</div>
      <footer>${ct?`<span class="tag" style="--c:${c}">${esc(ct.name)}</span>`:'<span></span>'}<span>${when(n.updated)}</span></footer>
    </article>`;
  }).join('');
  $('#grid').querySelectorAll('.card').forEach(el=>el.onclick=()=>editor(S.notes.find(n=>n.id===el.dataset.id)));
}
function when(t){
  const d=new Date(t),n=new Date(),day=864e5;
  const s=new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(s===0)return d.toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'});
  if(s===day)return 'учора';
  return d.toLocaleDateString('uk',{day:'numeric',month:'short'});
}
function render(){renderRail();renderGrid()}

/* ============ modal ============ */
function modal(html){
  const v=document.createElement('div');
  v.className='veil';
  v.innerHTML=`<div class="sheet">${html}</div>`;
  v.onclick=e=>{if(e.target===v)close(v)};
  $('#modals').appendChild(v);
  document.body.style.overflow='hidden';
  return v;
}
function close(v){
  v.remove();
  if(!$('#modals').children.length)document.body.style.overflow='';
}

/* ============ editor ============ */
function editor(note){
  const isNew=!note;
  const n=note?JSON.parse(JSON.stringify(note)):{
    id:uid(),emoji:'💗',title:'',text:'',
    catId:S.categories[0]?S.categories[0].id:null,
    list:{style:'heart',items:[]},created:Date.now(),updated:Date.now()
  };
  if(!n.list)n.list={style:'heart',items:[]};

  const v=modal(`
    <div class="sheet-h">
      <span class="t">${isNew?'новий клаптик':'нотатка'}</span>
      <button class="x" data-close>✕</button>
    </div>
    <div class="sheet-b" id="eb"></div>
    <div class="sheet-f">
      ${isNew?'':'<button class="btn ghost danger" id="del">видалити</button>'}
      <button class="btn primary" id="ok">зберегти</button>
    </div>`);
  v.querySelector('[data-close]').onclick=()=>close(v);

  const body=v.querySelector('#eb');
  function paint(){
    body.style.setProperty('--c',colorOf(n));
    body.innerHTML=`
      <div class="row">
        <button class="emoji-btn" id="emo">${n.emoji}</button>
        <input class="f-title" id="ti" placeholder="заголовок" value="${esc(n.title)}">
      </div>

      <span class="label">категорія</span>
      <div class="rail" style="margin:0;padding:0 0 4px" id="cats">
        ${S.categories.map(c=>`<button class="chip ${n.catId===c.id?'on':''}" data-c="${c.id}" style="--c:${c.color}"><i class="dot"></i>${esc(c.name)}</button>`).join('')}
        <button class="chip ${n.catId?'':'on'}" data-c="">без категорії</button>
        <button class="chip add" id="newCat">＋</button>
      </div>

      <span class="label">текст</span>
      <textarea class="f-text" id="tx" placeholder="пиши тут…">${esc(n.text)}</textarea>
      <button class="add-item" id="insEmo" style="margin-top:8px">😊 вставити емодзі в текст</button>

      <span class="label">список</span>
      <div class="seg" id="seg">
        ${STYLES.map(([k,l])=>`<button data-s="${k}" class="${n.list.style===k?'on':''}">${l}</button>`).join('')}
      </div>
      <ul class="items" id="items">
        ${n.list.items.map((it,i)=>`
          <li class="item" data-i="${i}">
            ${(n.list.style==='check'||n.list.style==='heart')
              ? `<button class="box ${it.done?'on':''}" data-tg="${i}">${it.done?(n.list.style==='heart'?'♥':'✓'):''}</button>`
              : `<span class="mk">${marker(n.list.style,i,it.done)||'—'}</span>`}
            <input value="${esc(it.text)}" data-in="${i}" placeholder="пункт списку">
            <button class="rm" data-rm="${i}">✕</button>
          </li>`).join('')}
      </ul>
      <button class="add-item" id="addItem">＋ додати пункт</button>`;

    body.querySelector('#ti').oninput=e=>n.title=e.target.value;
    body.querySelector('#tx').oninput=e=>n.text=e.target.value;
    body.querySelector('#emo').onclick=()=>emojiSheet(e=>{n.emoji=e;paint()});
    body.querySelector('#insEmo').onclick=()=>emojiSheet(e=>{
      const ta=body.querySelector('#tx'),p=ta.selectionStart;
      n.text=n.text.slice(0,p)+e+n.text.slice(ta.selectionEnd);
      paint();const t2=body.querySelector('#tx');t2.focus();t2.setSelectionRange(p+e.length,p+e.length);
    });
    body.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{n.catId=b.dataset.c||null;paint()});
    body.querySelector('#newCat').onclick=()=>catSheet(()=>paint());
    body.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{n.list.style=b.dataset.s;paint()});
    body.querySelectorAll('[data-in]').forEach(i=>{
      i.oninput=e=>n.list.items[+i.dataset.in].text=e.target.value;
      i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();
        n.list.items.splice(+i.dataset.in+1,0,{text:'',done:false});paint();
        const nx=body.querySelector(`[data-in="${+i.dataset.in+1}"]`);if(nx)nx.focus();}};
    });
    body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{n.list.items.splice(+b.dataset.rm,1);paint()});
    body.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{
      const it=n.list.items[+b.dataset.tg];it.done=!it.done;paint()});
    body.querySelector('#addItem').onclick=()=>{
      n.list.items.push({text:'',done:false});paint();
      const all=body.querySelectorAll('[data-in]');all[all.length-1].focus()};
  }
  paint();

  v.querySelector('#ok').onclick=()=>{
    n.list.items=n.list.items.filter(i=>i.text.trim());
    if(!n.title.trim()&&!n.text.trim()&&!n.list.items.length){close(v);return}
    n.updated=Date.now();
    const i=S.notes.findIndex(x=>x.id===n.id);
    if(i<0)S.notes.push(n);else S.notes[i]=n;
    save();render();close(v);
    const r=v.querySelector('#ok').getBoundingClientRect();
    hearts(r.left+r.width/2,r.top);
  };
  const del=v.querySelector('#del');
  if(del)del.onclick=()=>{S.notes=S.notes.filter(x=>x.id!==n.id);save();render();close(v)};
}

/* ============ emoji ============ */
function emojiSheet(pick){
  let tab=0;
  const v=modal(`
    <div class="sheet-h"><span class="t">емодзі</span><button class="x" data-close>✕</button></div>
    <div class="sheet-b"><div class="tabs" id="tabs"></div><div class="emoji-grid" id="eg"></div></div>`);
  v.querySelector('[data-close]').onclick=()=>close(v);
  const paint=()=>{
    v.querySelector('#tabs').innerHTML=TABS.map((t,i)=>`<button class="${i===tab?'on':''}" data-t="${i}">${t}</button>`).join('');
    v.querySelector('#eg').innerHTML=EMOJI[TABS[tab]].split(' ').map(e=>`<button data-e="${e}">${e}</button>`).join('');
    v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;paint()});
    v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{pick(b.dataset.e);close(v)});
  };
  paint();
}

/* ============ categories ============ */
function catSheet(after){
  let color=PALETTE[S.categories.length%PALETTE.length];
  const v=modal(`
    <div class="sheet-h"><span class="t">категорії</span><button class="x" data-close>✕</button></div>
    <div class="sheet-b" id="cb"></div>
    <div class="sheet-f"><button class="btn primary" id="done">готово</button></div>`);
  v.querySelector('[data-close]').onclick=fin;
  v.querySelector('#done').onclick=fin;
  function fin(){close(v);render();if(after)after()}

  const b=v.querySelector('#cb');
  function paint(){
    b.innerHTML=
      S.categories.map(c=>`<div class="cat-row" style="--c:${c.color}">
        <i class="dot"></i><span>${esc(c.name)}</span>
        <span class="n">${S.notes.filter(n=>n.catId===c.id).length}</span>
        <button class="x" data-del="${c.id}">✕</button></div>`).join('')+
      `<span class="label">нова категорія</span>
       <div class="swatches">${PALETTE.map(p=>`<button class="sw ${p===color?'on':''}" data-p="${p}" style="background:${p}"></button>`).join('')}</div>
       <div class="new-cat"><input id="cn" placeholder="назва" maxlength="24"><button id="cadd">додати</button></div>`;
    b.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{color=x.dataset.p;paint()});
    b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{
      const id=x.dataset.del;
      S.categories=S.categories.filter(c=>c.id!==id);
      S.notes.forEach(n=>{if(n.catId===id)n.catId=null});
      if(filter===id)filter='all';
      save();paint();
    });
    const add=()=>{
      const name=b.querySelector('#cn').value.trim();
      if(!name)return;
      S.categories.push({id:uid(),name,color});
      color=PALETTE[S.categories.length%PALETTE.length];
      save();paint();
    };
    b.querySelector('#cadd').onclick=add;
    b.querySelector('#cn').onkeydown=e=>{if(e.key==='Enter')add()};
  }
  paint();
}

/* ============ parallax ============ */
const soft=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!soft){
  const L1=$('#doodles');
  let px=0,py=0,sy=0;
  const draw=()=>{
    L1.style.transform=`translate(${px*18}px,${py*18-sy*.06}px)`;
  };
  addEventListener('pointermove',e=>{
    px=e.clientX/innerWidth-.5; py=e.clientY/innerHeight-.5; draw();
  },{passive:true});
  addEventListener('scroll',()=>{sy=scrollY;draw()},{passive:true});
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null)return;
    px=Math.max(-1,Math.min(1,e.gamma/28))*.5;
    py=Math.max(-1,Math.min(1,((e.beta||45)-45)/28))*.5;
    draw();
  },{passive:true});
}

/* ============ little hearts on save ============ */
function hearts(x,y){
  if(soft)return;
  const glyphs=['♡','♥','✧','♡','❀','♡'];
  for(let i=0;i<9;i++){
    const el=document.createElement('span');
    el.className='hb';el.textContent=glyphs[i%glyphs.length];
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.fontSize=(13+Math.random()*17)+'px';
    el.style.setProperty('--dx',(Math.random()*180-90).toFixed(0)+'px');
    el.style.setProperty('--dr',(Math.random()*120-60).toFixed(0)+'deg');
    el.style.animationDelay=(i*45)+'ms';
    el.style.opacity=.55+Math.random()*.45;
    $('#burst').appendChild(el);
    setTimeout(()=>el.remove(),1800);
  }
}

$('#fab').onclick=()=>editor(null);
$('#q').oninput=e=>{query=e.target.value;renderGrid()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const m=$('#modals').lastElementChild;if(m)close(m)}
});
render();

/* ---- встановлення на телефон ---- */
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; $('#installBtn').style.display='block';
});
$('#installBtn').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt=null; $('#installBtn').style.display='none';
};
addEventListener('appinstalled',()=>{$('#installBtn').style.display='none'});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
